<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burnout Prototype (R3F)</title>
    <!-- Synchronous sizing so the R3F <Canvas> always measures a real height,
         even before the JS-imported stylesheet is injected in dev. -->
    <style>
        html, body, #root { margin: 0; width: 100%; height: 100%; }
        body { overflow: hidden; background: #0d0d14; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
</body>
</html>
